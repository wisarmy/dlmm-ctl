[package]
name = "dlmm-ctl"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.53"
dotenvy = "0.15.7"
clap = { version = "4.5.7", features = ["derive"] }
reqwest = { version = "0.11.27", features = ["json", "socks", "native-tls"] }
tokio = { version = "1.38.0", features = ["full"] }
serde = "1.0.203"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
serde_json = "1.0.117"
rand = "0.8.5"
anchor-client = { version = "0.28.0", features = ["async"] }
anchor-lang = { version = "0.28.0", features = ["event-cpi"] }
anchor-spl = "0.28.0"
#lb_clmm = { git = "https://github.com/MeteoraAg/dlmm-sdk.git" }
lb_clmm = { path = "./programs/lb_clmm" }
commons = { path = "./commons" }
solana-account-decoder = "1.14.0"
spl-associated-token-account = "1"
bytemuck = { version = "1.12.3", features = ["derive", "min_const_generics"] }
rust_decimal = { version = "1.36.0", features = ["maths"] }
ratatui = "0.29.0"
crossterm = "0.28.1"
tracing-appender = "0.2.3"
chrono = "0.4.39"


[dev-dependencies]
ctor = "0.2.8"
proptest = "1.2.0"
